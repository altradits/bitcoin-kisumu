name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:rsvp
      # Advisory-only until the Next 16 migration (tracked in #19): the only
      # published fixes for the flagged next/postcss/glob advisories are
      # semver-major, so a gating audit would block every PR with no remedy.
      - run: npm audit --audit-level=high
        continue-on-error: true
