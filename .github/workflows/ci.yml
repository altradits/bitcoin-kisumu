name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitcoinkisumu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bitcoinkisumu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:rsvp
      - run: npm run test:ratelimit
      - run: npm run test:db
      - run: npm run test:admin
      - run: npm run test:earners
      - run: npm run test:results
      - run: npm run test:export
      - run: npm run test:forms
      - run: npm run test:pilot
      - run: npm run test:merchants-payouts
      - run: npm run test:inflows
      - run: npm run test:verify
      - run: npm audit --audit-level=high
